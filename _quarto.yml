project:
  type: book
  output-dir: _book
  execute-dir: file

book:
  title: "Convenience sampling bias simulation"
  author: ""
  date: today
  chapters:
    - index.qmd
    - scripts/Simulation_study.qmd
  repo-url: https://github.com/bastienchassagnol/convenience-sampling-bias-simulation
  repo-actions: [source, issue]
  # downloads: [pdf]  # re-enable with format: pdf below
  sidebar:
    style: docked
    search: true

bibliography: []

format:
  html:
    theme: flatly
    toc: true
    toc-depth: 2
    number-sections: true
    # https://quarto.org/docs/output-formats/html-code.html
    code-fold: true
    code-overflow: wrap
    code-tools: true
    code-copy: true
    code-link: true
    code-line-numbers: false
    code-block-bg: true
    code-block-border-left: "#28A745"
    syntax-highlighting: github
    fig-width: 7
    fig-height: 5
    mermaid:
      theme: forest
  # PDF disabled for faster CI / local renders; uncomment to restore.
  # pdf:
  #   documentclass: scrreport
  #   toc: true
  #   number-sections: true
  #   fig-width: 6
  #   fig-height: 4.5
  #   mermaid-format: png

execute:
  warning: false
  message: true
  # Re-execute only when source changes; commit `_freeze/` for CI reuse
  # https://quarto.org/docs/projects/code-execution.html#freeze
  freeze: auto
  # Knitr/Jupyter chunk cache for faster local/CI recomputation
  # https://quarto.org/docs/projects/code-execution.html#cache
  cache: true
