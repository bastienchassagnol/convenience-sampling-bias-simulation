# Quarto Publish (book → GitHub Pages)
#
# Source branch: main (default). Publishing branch: gh-pages.
# Workflow builds `_book/` then deploys that folder to `gh-pages` (root).

on:
  workflow_dispatch:
  push:
    branches: [main, master]

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # TinyTeX via Quarto (not r-lib/setup-tinytex). Quarto ≥1.10 picks
      # ARM64 Linux bundles correctly (fixes quarto-cli#12124 / PR #14181).
      - name: Set up Quarto (+ TinyTeX)
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "1.10.18"
          tinytex: true

      - name: Install Chrome (Mermaid → PDF/PNG)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies (renv)
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      # downlit is required for Quarto HTML code-link (see _quarto.yml).
      - name: Ensure downlit for code-link
        run: Rscript -e 'if (!requireNamespace("downlit", quietly = TRUE)) renv::install("downlit")'

      # Quarto's PDF engine auto-installs missing CTAN packages via tlmgr
      # (latex-auto-install defaults to true) — no preemptive tlmgr step.
      - name: Render Quarto book (HTML + PDF)
        run: quarto render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          NITER: "100"

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _book
          clean: true
